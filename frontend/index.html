<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows Setup</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="bg-layer"></div>

  <div class="Container">
    <div class="content">
      <div class="graphic halfSection" id="graphic-area">
        <div id="animation-area"></div>
      </div>
      <div class="controls halfSection" id="page-container">
        <div id="page-region" class="page active"></div>
        <div id="page-keyboard" class="page"></div>
        <div id="page-keyboard-secondary" class="page"></div>
        <div id="page-network" class="page"></div>
        <div id="page-license" class="page"></div>
        <div id="page-device-naming" class="page"></div>
        <div id="page-account" class="page"></div>
        <div id="page-password" class="page"></div>
        <div id="page-privacy" class="page"></div>
        <div id="page-customization" class="page"></div>
        <div id="page-summary" class="page"></div>
        <div id="page-preparing" class="page"></div>
        <div id="page-hi" class="page"></div>
        <div id="page-completion" class="page"></div>
        <div class="controls-footer">
          <button id="btn-back" class="win-button" disabled>Back</button>
          <button id="btn-next" class="win-button control-button button_primary">Next</button>
        </div>
      </div>
    </div>

    <div class="footerView">
      <div class="page-footer">
        <div class="footer-icons">
          <button class="icon icon-win-easeOfAccess" id="btn-accessibility"
                  title="Ease of access"></button>
        </div>
        <div class="footer-icons">
          <button class="icon icon-win-keyboardStandard" id="btn-keyboard"
                  title="Keyboard"></button>
          <button class="icon icon-volume" id="btn-volume"
                  title="Volume"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="dev-panel" class="dev-panel hidden">
    <div class="dev-header">
      <span>Developer Mode</span>
      <button id="btn-dev-close" class="btn btn-small">&times;</button>
    </div>
    <div class="dev-body">
      <div class="dev-section">
        <label for="dev-page-select">Jump to page:</label>
        <select id="dev-page-select"></select>
        <button id="btn-dev-jump" class="btn btn-small">Go</button>
      </div>
      <div class="dev-section">
        <button id="btn-dev-reset" class="btn btn-small" style="background:rgba(196,43,28,0.7)">Reset State</button>
        <button id="btn-dev-export" class="btn btn-small">Export State</button>
        <button id="btn-dev-import" class="btn btn-small">Import State</button>
      </div>
      <div class="dev-section">
        <label>
          <input type="checkbox" id="chk-mock-data"> Mock Data
        </label>
      </div>
      <div class="dev-section">
        <label>Logs:</label>
        <div id="dev-log-output" class="dev-log-output"></div>
      </div>
    </div>
  </div>

  <script src="js/bridge.js"></script>
  <script src="js/state.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/router.js"></script>
  <script src="js/devmode.js"></script>
  <script src="js/pages/region.js"></script>
  <script src="js/pages/keyboard.js"></script>
  <script src="js/pages/keyboard-secondary.js"></script>
  <script src="js/pages/network.js"></script>
  <script src="js/pages/license.js"></script>
  <script src="js/pages/device-naming.js"></script>
  <script src="js/pages/account.js"></script>
  <script src="js/pages/password.js"></script>
  <script src="js/pages/privacy.js"></script>
  <script src="js/pages/customization.js"></script>
  <script src="js/pages/summary.js"></script>
  <script src="js/pages/preparing.js"></script>
  <script src="js/pages/hi.js"></script>
  <script src="js/pages/completion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
