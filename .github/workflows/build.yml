name: Build Custom OOBE

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Visual Studio environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      id: cache-vcpkg
      with:
        path: |
          C:\vcpkg\installed
          C:\vcpkg\packages
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Bootstrap vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        if (-not (Test-Path "C:\vcpkg")) {
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          & "C:\vcpkg\bootstrap-vcpkg.bat"
        }

    - name: Install dependencies via vcpkg (manifest mode)
      shell: pwsh
      run: |
        & "C:\vcpkg\vcpkg" install --triplet x64-windows

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B build `
          -S . `
          -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: pwsh
      run: |
        cmake --build build --config Release

    - name: Collect artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path artifacts -Force
        Copy-Item -Recurse "build\Release\*" "artifacts\" -ErrorAction SilentlyContinue
        $dllPath = "C:\vcpkg\installed\x64-windows\bin\WebView2Loader.dll"
        if (Test-Path $dllPath) {
          Copy-Item $dllPath "artifacts\"
          Write-Host "Copied WebView2Loader.dll"
        } else {
          Write-Host "WebView2Loader.dll not found at $dllPath"
        }
        Get-ChildItem -Path "artifacts" | ForEach-Object { Write-Host "  $($_.Name)" }
        Compress-Archive -Path "artifacts\*" -DestinationPath "custom-oobe-release.zip"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: custom-oobe-windows
        path: artifacts/
        if-no-files-found: error

    - name: Upload release ZIP
      uses: actions/upload-artifact@v4
      with:
        name: custom-oobe-release-zip
        path: custom-oobe-release.zip
