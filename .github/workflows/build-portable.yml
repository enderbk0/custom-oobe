name: Build Portable (with WebView2 Runtime)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          C:\vcpkg\installed
          C:\vcpkg\packages
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}
        restore-keys: ${{ runner.os }}-vcpkg-

    - name: Bootstrap vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        if (-not (Test-Path "C:\vcpkg")) {
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          & "C:\vcpkg\bootstrap-vcpkg.bat"
        }

    - name: Install vcpkg deps
      shell: pwsh
      run: |
        & "C:\vcpkg\vcpkg" install --triplet x64-windows

    - name: Download WebView2 Fixed Runtime
      shell: pwsh
      run: |
        $arch = "x64"
        Write-Host "Fetching latest release from westinyang/WebView2RuntimeArchive..."
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/westinyang/WebView2RuntimeArchive/releases/latest"
        $tag = $release.tag_name
        Write-Host "Latest version: $tag"

        $assetName = "Microsoft.WebView2.FixedVersionRuntime.$tag.$arch.cab"
        $asset = $release.assets | Where-Object { $_.name -eq $assetName }
        if (-not $asset) { throw "Asset '$assetName' not found" }

        $cabUrl = $asset.browser_download_url
        $cabPath = "$env:TEMP\wv2_runtime.cab"
        Write-Host "Downloading from: $cabUrl"
        Invoke-WebRequest -Uri $cabUrl -OutFile $cabPath

        Write-Host "Extracting..."
        $tmpDir = "$env:TEMP\wv2_runtime_extract"
        New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null
        & expand $cabPath -F:* $tmpDir
        if (-not $?) { throw "expand failed" }

        $innerDir = Get-ChildItem $tmpDir -Directory | Select-Object -First 1
        if (-not $innerDir) { throw "No subfolder found in extracted CAB" }
        New-Item -ItemType Directory -Path "runtime" -Force | Out-Null
        Move-Item "$($innerDir.FullName)\*" "runtime\" -Force
        Remove-Item $tmpDir -Recurse -Force
        Remove-Item $cabPath -Force

        Get-ChildItem "runtime" -Depth 0 | ForEach-Object { Write-Host "  $($_.Name)" }
        Write-Host "Size: $(Get-ChildItem runtime -Recurse | Measure-Object Length -Sum | ForEach-Object { '{0:N0} KB' -f ($_.Sum / 1KB) })"

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B build -S . `
          -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: pwsh
      run: cmake --build build --config Release

    - name: Package portable
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path portable -Force
        Copy-Item "build\Release\*" "portable\" -Recurse -ErrorAction SilentlyContinue
        Copy-Item "runtime\*" "portable\WebView2Runtime\" -Recurse -Force
        Get-ChildItem "portable" -Depth 0 | ForEach-Object { Write-Host "  $($_.Name)" }
        Compress-Archive -Path "portable\*" -DestinationPath "custom-oobe-portable.zip"

    - name: Upload portable artifact
      uses: actions/upload-artifact@v4
      with:
        name: custom-oobe-portable
        path: portable/
        if-no-files-found: error

    - name: Upload portable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: custom-oobe-portable-zip
        path: custom-oobe-portable.zip
